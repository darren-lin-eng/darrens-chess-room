<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Darren's Chess Room</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23769656%27/%3E%3Ctext x=%2716%27 y=%2725%27 font-size=%2724%27 text-anchor=%27middle%27 fill=%27%23EEEED2%27%3E%E2%99%9E%3C/text%3E%3C/svg%3E">
<style>
:root{--w9:#1c120b;--w8:#2a1b11;--w7:#3b2717;--w6:#52361f;--w5:#6d4a2b;--w4:#8a6339;--cream:#f4e8d4;--muted:#c8b08e;--green:#769656;--green-d:#5b7a40;--lime:#BACA44;--lt:#EEEED2;--red:#d9534f}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--cream);line-height:1.55;min-height:100vh;
background:repeating-linear-gradient(92deg,rgba(255,255,255,.018) 0 2px,transparent 2px 9px),repeating-linear-gradient(88deg,rgba(0,0,0,.14) 0 1px,transparent 1px 13px),linear-gradient(180deg,var(--w8),var(--w9));}
h1,h2,h3{font-family:Lora,Georgia,serif;font-weight:700;margin:0 0 .4em;color:var(--cream)}
h1{font-size:1.9rem}h2{font-size:1.4rem}h3{font-size:1.05rem}
a{color:var(--lime)}
header{background:linear-gradient(var(--w7),var(--w8));border-bottom:2px solid var(--w5);box-shadow:0 2px 8px rgba(0,0,0,.4);position:sticky;top:0;z-index:5}
.hwrap{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.brand{font-family:Lora,Georgia,serif;font-weight:700;font-size:1.25rem;color:var(--cream);text-decoration:none;display:flex;align-items:center;gap:8px}
.brand .mk{width:26px;height:26px;border-radius:5px;background:var(--green);color:var(--lt);display:flex;align-items:center;justify-content:center;font-size:18px}
nav{display:flex;flex-wrap:wrap;gap:4px;flex:1}
nav a{color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:8px;font-size:.92rem}
nav a:hover{background:var(--w6);color:var(--cream)}
nav a.on{background:var(--green);color:#fff}
#eng{font-size:.75rem;color:var(--muted);border:1px solid var(--w5);border-radius:99px;padding:2px 10px}
main{max-width:1040px;margin:0 auto;padding:22px 16px 60px}
.panel{background:linear-gradient(var(--w7),var(--w6));border:1px solid var(--w5);border-radius:12px;padding:16px 18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 3px 10px rgba(0,0,0,.35)}
.muted{color:var(--muted)}.small{font-size:.85rem}
.grid2{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:16px}
.card{display:block;text-decoration:none;color:var(--cream)}
.card:hover{border-color:var(--lime);transform:translateY(-1px)}
.card .st{margin-top:8px;font-size:.82rem;color:var(--lime)}
.btn{font:inherit;font-size:.92rem;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;background:var(--green);color:#fff;font-weight:600;box-shadow:0 2px 0 var(--green-d)}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px);box-shadow:none}
.btn.alt{background:var(--w5);box-shadow:0 2px 0 var(--w7);color:var(--cream)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text],textarea,select{font:inherit;background:var(--w9);color:var(--cream);border:1px solid var(--w5);border-radius:8px;padding:8px 10px}
textarea{width:100%;min-height:150px;font-family:ui-monospace,Menlo,monospace;font-size:.82rem}
input:focus,textarea:focus,select:focus,.btn:focus-visible{outline:2px solid var(--lime);outline-offset:1px}
.board{--sq:min(11.2vw,60px);display:grid;grid-template-columns:repeat(8,var(--sq));padding:10px;border-radius:8px;width:max-content;max-width:100%;
background:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 3px,transparent 3px 8px),linear-gradient(var(--w5),var(--w4));box-shadow:0 6px 18px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.4)}
.board.mini{--sq:30px;padding:5px;border-radius:5px}
.board.mini .co{display:none}
.sq{width:var(--sq);height:var(--sq);position:relative;display:flex;align-items:center;justify-content:center;font-size:calc(var(--sq)*.8);line-height:1;user-select:none;cursor:pointer}
.sq.l{background:var(--lt)}.sq.d{background:var(--green)}
.sq>*{position:relative;z-index:2}
.sq::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none}
.sq.last::before{background:rgba(255,235,59,.42)}
.sq.sel::before{background:rgba(255,235,59,.7)}
.sq.good::before{background:rgba(60,190,70,.65)}
.sq.bad::before{background:rgba(220,60,50,.62)}
.sq.hint::before{background:rgba(70,160,255,.6)}
.sq.tgt::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(20,60,20,.38);z-index:3;pointer-events:none}
.sq.cap::after{content:"";position:absolute;inset:6%;border-radius:50%;border:4px solid rgba(20,60,20,.4);z-index:3;pointer-events:none}
.p{display:flex;width:100%;height:100%;align-items:center;justify-content:center}
.pc{width:90%;height:90%;display:block;background:center/contain no-repeat;filter:drop-shadow(0 1.5px 1px rgba(0,0,0,.3));pointer-events:none}
.p svg{width:90%;height:90%;display:block;filter:drop-shadow(0 1.5px 1px rgba(0,0,0,.3));pointer-events:none}
body.nolabels .co{display:none}
input[type=range]{width:100%;accent-color:var(--green)}
.band li{margin:3px 0}
.tgl{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);cursor:pointer}
.tgl input{accent-color:var(--green);width:16px;height:16px}
.xp p{margin:.35rem 0;font-size:.9rem}.xp b.h{color:var(--lime)}
.co{position:absolute;font-size:10px;font-weight:700;z-index:2;pointer-events:none;opacity:.85}
.co.f{right:3px;bottom:1px}.co.r{left:3px;top:1px}
.sq.l .co{color:var(--green)}.sq.d .co{color:var(--lt)}
.big{font-family:Lora,Georgia,serif;font-size:3.2rem;font-weight:700;color:var(--lime);line-height:1}
.stat{display:flex;gap:18px;flex-wrap:wrap}.stat div{min-width:70px}.stat b{display:block;font-size:1.4rem;font-family:Lora,Georgia,serif}
.msg{padding:8px 12px;border-radius:8px;background:var(--w9);border-left:4px solid var(--lime);margin:10px 0}
.msg.err{border-left-color:var(--red)}
.log{background:var(--w9);border-radius:8px;padding:8px 10px;height:130px;overflow:auto;font-size:.88rem;font-family:ui-monospace,Menlo,monospace}
.bar{height:12px;background:var(--w9);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--w5);color:var(--cream)}
.tag.blunder{background:#a33a35}.tag.mistake{background:#b8741e}.tag.inacc{background:#7a7a2e}.tag.tp{background:var(--lime);color:#1c120b}
.epos{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin-bottom:8px;background:var(--w8);border:1px solid var(--w5);border-radius:10px;padding:9px 12px;color:var(--cream);font:inherit;cursor:pointer}
.epos.on{border-color:var(--lime);background:var(--w9)}
.dots{display:flex;gap:4px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--w5)}.dots i.f{background:var(--lime)}
.issue{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--w5)}
.tbl td{padding:3px 12px 3px 0}
</style>
</head>
<body>
<header><div class="hwrap">
<a class="brand" href="#home"><span class="mk">&#9822;&#xFE0E;</span>Darren's Chess Room</a>
<nav id="nav">
<a href="#home" data-r="home">Home</a><a href="#coords" data-r="coords">Coordinates</a><a href="#blind" data-r="blind">Blindfold</a><a href="#blunders" data-r="blunders">Blunder checker</a><a href="#stats" data-r="stats">Stats</a>
</nav>
<label class="tgl"><input type="checkbox" id="lbl" checked> Board coordinates</label>
<span id="eng">Engine: loading&hellip;</span>
</div></header>

    w.onmessage=e=>{const l=String(e.data);
      if(l.indexOf("info")===0&&l.indexOf(" score ")>0&&l.indexOf("bound")<0){const m=l.match(/score (cp|mate) (-?\d+)/);
        if(m)score=m[1]==="cp"?+m[2]:(+m[2]>0?1:-1)*(30000-Math.abs(+m[2])*10)}
      else if(l.indexOf("bestmove")===0){clearTimeout(to);res({score,best:this.parse(l.split(" ")[1]),scores:null})}};
    w.postMessage("position fen "+fen);w.postMessage("go movetime "+(o.movetime||600))})},
  async weak(fen){
    const ch=new Chess(fen);const ms=ch.moves({verbose:true});if(!ms.length)return null;
    const elo=store.get("elo",800);if(Math.random()<Math.max(0.04,0.28-(elo-400)*0.00015)){const m=ms[Math.floor(Math.random()*ms.length)];return{from:m.from,to:m.to,promotion:m.promotion}}
    await sleep(0);return builtinSearch(fen,2,60,40000).best}
};

/* ---------- blunder checker ---------- */
const SAMPLE="[Event \"Casual game\"]\n[White \"Knight_Study_Demo\"]\n[Black \"You_As_Black\"]\n[Result \"1-0\"]\n\n1. e4 e5 2. Nf3 d6 3. Bc4 Bg4 4. Nc3 g6 5. Nxe5 Bxd1 6. Bxf7+ Ke7 7. Nd5# 1-0";
function flipTurn(fen){const p=fen.split(" ");p[1]=p[1]==="w"?"b":"w";p[3]="-";return p.join(" ")}
function freeCapture(fen){const ch=new Chess(fen);let best={gain:0,move:null};
  for(const m of ch.moves({verbose:true})){if(!m.captured)continue;ch.move(m);
    const mated=ch.in_checkmate();const rec=!mated&&ch.moves({verbose:true}).some(r=>r.to===m.to&&r.captured);ch.undo();
    const gain=mated?10000:PV[m.captured]-(rec?PV[m.piece]:0);if(gain>best.gain)best={gain,move:m,rec}}
  return best}
function mateInOne(fen){const ch=new Chess(fen);for(const m of ch.moves({verbose:true})){ch.move(m);const mt=ch.in_checkmate();ch.undo();if(mt)return m}return null}
const clampCp=c=>Math.max(-1000,Math.min(1000,c));

const NAME={p:"pawn",n:"knight",b:"bishop",r:"rook",q:"queen",k:"king"};
const PTS={p:1,n:3,b:3,r:5,q:9,k:0};
function matPts(fen,color){let s=0;for(const row of new Chess(fen).board())for(const p of row)if(p)s+=(p.color===color?1:-1)*PTS[p.type];return s}
function fmtEv(cp){return cp>=1000?"completely winning":cp<=-1000?"completely lost":(cp>0?"+":"")+(cp/100).toFixed(1)}
function describeMove(bm){if(!bm)return"";const bits=[];
  if(bm.flags.indexOf("k")>=0||bm.flags.indexOf("q")>=0)bits.push("castles your king to safety");
  if(bm.captured)bits.push("captures a "+NAME[bm.captured]+" on "+bm.to);
  if(bm.promotion)bits.push("promotes a pawn");
  if(/[+#]/.test(bm.san))bits.push(bm.san.indexOf("#")>=0?"is checkmate":"gives check");
  if(!bits.length){if((bm.piece==="n"||bm.piece==="b")&&(bm.from[1]==="1"||bm.from[1]==="8"))bits.push("develops a piece toward the center");
    else if(bm.piece==="p"&&"de".indexOf(bm.to[0])>=0)bits.push("fights for the center");else bits.push("improves the position of your "+NAME[bm.piece])}
  return bits.join(" and ")}
function explainMove(e,c){const m=c.m;const pn=NAME[m.piece];
  const how=m.captured?"your "+pn+" took a "+NAME[m.captured]+" on "+m.to:"your "+pn+" went from "+m.from+" to "+m.to;
  const what="You played <b>"+e.san+"</b> ("+how+"). The engine rated your position "+fmtEv(e.before)+" before this move and "+fmtEv(e.after)+" after it, a drop of about "+(Math.min(e.loss,1000)/100).toFixed(1)+" pawns.";
  let why="";
  switch(e.type){
    case"Missed mate in one":why="You had checkmate available with <b>"+c.myMate.san+"</b>. When the enemy king looks exposed, check every checking move first. One of them may end the game.";break;
    case"Allowed checkmate":why="After your move, they can play <b>"+c.oppMate.san+"</b>, which is checkmate. "+(m.piece==="k"?"Moving the king took away escape squares or protection.":"Your move did not stop that attack, or it pulled a defender away from your king.");break;
    case"Hung a piece":{const t=c.fcPost.move;
      why="After your move, their "+NAME[t.piece]+" on "+t.from+" can capture your "+NAME[t.captured]+" on "+t.to+" (<b>"+t.san+"</b>). "+(c.fcPost.rec?"You could recapture, but the trade still costs you material.":"Nothing of yours can take it back, so the piece is simply lost.")+(t.to===m.to?" The piece you just moved is the one left unprotected.":" Your move left that "+NAME[t.captured]+" without enough protection, possibly because the piece you moved was defending it.");break}
    case"Ignored a threat":{const t=c.thr.move;
      why="Before your move, their "+NAME[t.piece]+" on "+t.from+" was already attacking your "+NAME[t.captured]+" on "+t.to+". <b>"+e.san+"</b> did not deal with that, so the threat stayed. You could have moved the piece, defended it, or captured the attacker.";break}
    case"Missed free material":{const t=c.fcPre.move;
      why="You could have won a "+NAME[t.captured]+" with <b>"+t.san+"</b>. "+(c.fcPre.rec?"They can recapture, but you would still come out ahead.":"They had no way to take it back, so it was free.")+" Look for loose enemy pieces before starting your own plan.";break}
    case"Missed a tactic":why="The engine's move <b>"+(e.bestSan||"")+"</b> "+describeMove(c.bm)+". It wins something concrete or forces matters in your favor, and your move let that chance slip away.";break;
    case"Opening mistake":{let r;
      if(m.piece==="q")r="You brought the queen out early, where minor pieces can chase it while you lose time.";
      else if(m.piece==="k"&&m.flags.indexOf("k")<0&&m.flags.indexOf("q")<0)r="You moved the king by hand instead of castling, which usually leaves it less safe.";
      else if(m.piece==="p"&&(m.from[0]==="a"||m.from[0]==="h"))r="An edge-pawn move does little for the center or for development.";
      else r="This move did not help your development or the center, and your opponent made use of the extra time.";
      why=r+" In the first ten moves, aim to control the center, develop your knights and bishops, and castle.";break}
    default:why="No piece was hanging and there was no immediate tactic. The engine simply judges that this move gives away some of your advantage"+(c.bm?", while <b>"+e.bestSan+"</b> "+describeMove(c.bm):"")+". Quiet errors like this are the hardest to see. When unsure, improve your worst-placed piece.";}
  let punish="";
  if(c.reply){const lost=matPts(e.pre,m.color)-matPts(c.after,m.color);
    punish="Their strongest reply is <b>"+c.reply.san+"</b>."+(lost>=1?" That leaves you about "+lost+" point"+(lost>1?"s":"")+" of material down compared with before your move.":"")}
  const instead=e.bestSan?"Better was <b>"+e.bestSan+"</b>"+(c.bm?", which "+describeMove(c.bm):"")+". The engine rates the position "+fmtEv(e.before)+" if you play it.":"";
  return{what,why,punish,instead,avoid:TYPE_TIPS[e.type]||""}}

function parsePgn(pgn){let g=new Chess();if(g.load_pgn(pgn))return g;g=new Chess();if(g.load_pgn(pgn,{sloppy:true}))return g;return null}
const mkKey=m=>m.from+m.to+(m.promotion||"");
async function analyzeGame(pgn,color,prog){
  const g=parsePgn(pgn);if(!g)return null;
  const hd=g.header();const moves=g.history({verbose:true});const start=hd.FEN&&hd.SetUp==="1"?hd.FEN:undefined;
  const r=start?new Chess(start):new Chess();const fens=[r.fen()];
  for(const m of moves){r.move({from:m.from,to:m.to,promotion:m.promotion});fens.push(r.fen())}
  const N=Math.min(moves.length,160);const ev=[];const sf=Engine.mode==="stockfish";Engine.newGame();
  const need=i=>sf?true:(i<N&&moves[i].color===color);let total=0,done=0;for(let i=0;i<=N;i++)if(need(i))total++;
  for(let i=0;i<=N;i++){if(!need(i))continue;const c=new Chess(fens[i]);
    if(c.game_over())ev[i]={score:c.in_checkmate()?-30000:0,best:null,scores:{}};
    else ev[i]=await Engine.analyze(fens[i],{depth:2,movetime:350,nodes:150000,exact:true});
    prog(++done/total)}
  const out=[];
  for(let i=0;i<N;i++){const m=moves[i];if(m.color!==color)continue;
    const before=clampCp(ev[i].score);const rawAfter=sf?-ev[i+1].score:(ev[i].scores&&ev[i].scores[mkKey(m)]!==undefined?ev[i].scores[mkKey(m)]:ev[i].score);
    const after=clampCp(rawAfter);const bb=ev[i].best;const same=bb&&mkKey(bb)===mkKey(m);const loss=same?0:Math.max(0,before-after);
    const e={i,moveNo:Math.floor(i/2)+1,san:m.san,loss,before,after,pre:fens[i],played:{from:m.from,to:m.to},best:ev[i].best,sev:null,type:null};
    const elo=store.get("elo",800),tb=elo<1000?300:elo<1400?250:200,tm=elo<1000?150:elo<1400?120:100,ti=elo<1000?80:60;
    if(loss>=tb)e.sev="blunder";else if(loss>=tm)e.sev="mistake";else if(loss>=ti)e.sev="inacc";
    if(e.best){try{const t=new Chess(fens[i]);const bm=t.move(e.best);e.bestSan=bm?bm.san:"";e.bestCapOrCheck=bm&&(bm.san.indexOf("x")>=0||bm.san.indexOf("+")>=0||bm.san.indexOf("#")>=0)}catch(x){}}
    if(e.sev==="blunder"||e.sev==="mistake"){
      const post=fens[i+1];const myMate=mateInOne(fens[i]);const hasMate=myMate&&m.san.indexOf("#")<0;
      const postOver=new Chess(post).game_over();const oppMate=postOver?null:mateInOne(post);
      const fcPost=freeCapture(post),fcPre=freeCapture(fens[i]),thr=freeCapture(flipTurn(fens[i]));
      const c={m,myMate,oppMate,fcPost,fcPre,thr,reply:null,bm:null,after:null};
      if(e.best){try{c.bm=new Chess(fens[i]).move(e.best)}catch(x){}}
      if(!postOver){const rb=sf?ev[i+1].best:(await Engine.analyze(post,{depth:2,movetime:350,nodes:150000})).best;
        if(rb){try{const t=new Chess(post);c.reply=t.move(rb);c.after=t.fen()}catch(x){}}}
      if(hasMate)e.type="Missed mate in one";
      else if(oppMate)e.type="Allowed checkmate";
      else if(fcPost.gain>=200)e.type=(thr.gain>=200&&fcPost.move.to===thr.move.to&&m.from!==thr.move.to)?"Ignored a threat":"Hung a piece";
      else if(fcPre.gain>=200)e.type="Missed free material";
      else if(e.bestCapOrCheck&&loss>=200)e.type="Missed a tactic";
      else if(e.moveNo<=10)e.type="Opening mistake";else e.type="Positional slip";
      e.exp=explainMove(e,c);
    }
    out.push(e)}
  // turning point
  let tp=null;for(const e of out){if(e.sev&&e.sev!=="inacc"&&e.before>=-150&&e.after<-200&&(!tp||e.loss>tp.loss))tp=e}
  if(!tp)for(const e of out){if((e.sev==="blunder"||e.sev==="mistake")&&(!tp||e.loss>tp.loss))tp=e}
  const avg=out.length?Math.round(out.reduce((s,e)=>s+Math.min(e.loss,1000),0)/out.length):0;
  return{hd,out,tp,avg,total:N};
}

function viewBlunders(el){
  const U=store.get("user","");let alive=true;
  el.innerHTML='<h2>Blunder checker</h2><div class="panel"><p class="muted small" style="margin-top:0">On Chess.com, open a game, choose Share, then PGN, and copy it. On Lichess, open the game and use the PGN tab under the board. Paste it here. The check runs in your browser.</p>'+
  '<textarea id="pgn" placeholder="Paste your PGN here"></textarea>'+
  '<div class="row" style="margin-top:10px"><label class="small">Your username <input type="text" id="user" value="'+String(U).replace(/"/g,"")+'" style="width:150px"></label>'+
  '<label class="small">I played <select id="col"><option value="auto">Detect from username</option><option value="w">White</option><option value="b">Black</option></select></label>'+
  '<button class="btn" id="run">Check my game</button><button class="btn alt" id="smp">Load a sample</button></div>'+
  '<div class="bar" style="margin-top:10px;display:none" id="pb"><i style="width:0"></i></div></div><div id="res"></div>';
  $("#smp").onclick=()=>{$("#pgn").value=SAMPLE;$("#col").value="b"};
  $("#run").onclick=async()=>{const pgn=$("#pgn").value.trim();const res=$("#res");
    if(!pgn){res.innerHTML='<div class="msg err">Paste a PGN first.</div>';return}
    const user=$("#user").value.trim();store.set("user",user);
    let col=$("#col").value;
    if(col==="auto"){const t=parsePgn(pgn);if(!t){res.innerHTML='<div class="msg err">That PGN could not be read. Copy the full game text, headers included.</div>';return}
      const h=t.header();if(user&&h.White&&h.White.toLowerCase()===user.toLowerCase())col="w";else if(user&&h.Black&&h.Black.toLowerCase()===user.toLowerCase())col="b";
      else{res.innerHTML='<div class="msg err">Could not match your username to White or Black in this game. Pick your color from the list.</div>';return}}
    $("#run").disabled=true;res.innerHTML="";const pb=$("#pb");pb.style.display="block";
    await Engine.init();
    const data=await analyzeGame(pgn,col,p=>{pb.firstElementChild.style.width=Math.round(p*100)+"%"});
    pb.style.display="none";$("#run").disabled=false;if(!alive)return;
    if(!data){res.innerHTML='<div class="msg err">That PGN could not be read. Copy the full game text, headers included.</div>';return}
    renderBlunders(res,data,col)};
  return()=>{alive=false};
}
function renderBlunders(el,d,col){
  const flagged=d.out.filter(e=>e.sev==="blunder"||e.sev==="mistake");
  const counts={blunder:0,mistake:0,inacc:0};d.out.forEach(e=>{if(e.sev)counts[e.sev]++});
  const types={};flagged.forEach(e=>{types[e.type]=(types[e.type]||0)+1});
  const hist=store.get("bhist",{games:0,types:{}});hist.games++;for(const k in types)hist.types[k]=(hist.types[k]||0)+types[k];store.set("bhist",hist);logEvent({k:"check",avg:d.avg,b:counts.blunder,m:counts.mistake,i:counts.inacc,types});
  let h='<div class="panel" style="margin-top:16px"><h3>Summary</h3><div class="stat"><div><span class="muted small">Blunders</span><b>'+counts.blunder+'</b></div><div><span class="muted small">Mistakes</span><b>'+counts.mistake+'</b></div><div><span class="muted small">Inaccuracies</span><b>'+counts.inacc+'</b></div><div><span class="muted small">Avg loss / move</span><b>'+(d.avg/100).toFixed(2)+'</b></div></div>'+
   '<p class="muted small" style="margin-bottom:0">Analysis by '+(Engine.mode==="stockfish"?"Stockfish":"the built-in engine, which is shallower and may miss deeper ideas")+'. Evaluations are from your side, in pawns.</p></div>';
  if(!flagged.length)h+='<div class="msg">No blunders or mistakes found. Nice, clean game.</div>';
  else{
    const entries=Object.entries(types).sort((a,b)=>b[1]-a[1]);const mx=entries[0][1];
    h+='<div class="panel" style="margin-top:14px"><h3>Mistakes by type</h3>'+entries.map(([t,n])=>'<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><b>'+t+'</b><span>'+n+'</span></div><div class="bar"><i style="width:'+(n/mx*100)+'%"></i></div><div class="muted small">'+(TYPE_TIPS[t]||"")+'</div></div>').join("")+'</div>';
    if(d.tp)h+='<div class="panel" style="margin-top:14px"><h3>Where the game turned</h3><p style="margin:0">On move '+d.tp.moveNo+' you played <b>'+d.tp.san+'</b> ('+d.tp.type+'). Your position went from '+fmtEv(d.tp.before)+' to '+fmtEv(d.tp.after)+'.'+(d.tp.bestSan?' The engine preferred <b>'+d.tp.bestSan+'</b>.':'')+'</p></div>';
    h+='<div class="panel" style="margin-top:14px"><h3>Moves to review</h3><div id="iss"></div></div>'}
  el.innerHTML=h;
  const box=$("#iss",el);if(!box)return;
  flagged.forEach(e=>{const row=document.createElement("div");row.className="issue";const bw=document.createElement("div");
    row.appendChild(bw);const info=document.createElement("div");
    const x=e.exp;
    info.className="xp";
    info.innerHTML='<div class="row"><span class="tag '+e.sev+'">'+(e.sev==="blunder"?"Blunder":"Mistake")+'</span>'+(d.tp===e?'<span class="tag tp">Turning point</span>':"")+'<span class="tag">'+e.type+'</span><b>Move '+e.moveNo+': '+e.san+'</b></div>'+
      '<p><b class="h">What happened.</b> '+x.what+'</p><p><b class="h">Why it is a problem.</b> '+x.why+(x.punish?" "+x.punish:"")+'</p>'+
      (x.instead?'<p><b class="h">What to play instead.</b> '+x.instead+'</p>':"")+(x.avoid?'<p><b class="h">Next time.</b> '+x.avoid+'</p>':"")+
      '<div class="muted small">Red squares: your move. Green: the engine\'s choice.</div>';
    row.appendChild(info);box.appendChild(row);
    const marks={};marks[e.played.from]="bad";marks[e.played.to]="bad";if(e.best){marks[e.best.from]="good";marks[e.best.to]="good"}
    const bb=new Board(bw,{mini:true,flip:col==="b"});bb.render(new Chess(e.pre),{marks,nocoords:true})});
}

/* ---------- stats ---------- */
function lineChart(vals,fmt,color){
  if(vals.length<2)return'<p class="muted small" style="margin:6px 0 0">Not enough data yet. This chart appears after two or more entries.</p>';
  const W=360,H=110,px=28,py=14,mx=Math.max(...vals,1e-9),mn=Math.min(...vals,0);const rng=(mx-mn)||1;
  const X=i=>px+i*(W-px-8)/(vals.length-1),Y=v=>H-py-(v-mn)/rng*(H-2*py);
  const pts=vals.map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ");
  return'<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" role="img"><line x1="'+px+'" y1="'+(H-py)+'" x2="'+(W-8)+'" y2="'+(H-py)+'" stroke="#6d4a2b"/>'+
   '<polyline fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" points="'+pts+'"/>'+
   vals.map((v,i)=>'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="3" fill="'+color+'"><title>'+fmt(v)+'</title></circle>').join("")+
   '<text x="2" y="'+(Y(mx)+4)+'" fill="#c8b08e" font-size="10">'+fmt(mx)+'</text><text x="2" y="'+(H-py+4)+'" fill="#c8b08e" font-size="10">'+fmt(mn)+'</text></svg>'}
function barChart(vals,color){
  if(!vals.length)return'<p class="muted small" style="margin:6px 0 0">No rounds yet.</p>';
  const W=360,H=110,py=14,mx=Math.max(...vals,1),bw=(W-12)/vals.length;
  return'<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" role="img"><line x1="4" y1="'+(H-py)+'" x2="'+(W-4)+'" y2="'+(H-py)+'" stroke="#6d4a2b"/>'+
   vals.map((v,i)=>{const h=v/mx*(H-2*py);return'<rect x="'+(6+i*bw+1).toFixed(1)+'" y="'+(H-py-h).toFixed(1)+'" width="'+Math.max(2,bw-3).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" fill="'+color+'"><title>'+v+'</title></rect>'}).join("")+
   '<text x="4" y="10" fill="#c8b08e" font-size="10">best '+mx+'</text></svg>'}
function viewStats(el){
  const log=store.get("log",[]),co=store.get("coords",{}),bl=store.get("blind",{g:0,w:0,peeks:0}),hist=store.get("bhist",{games:0,types:{}});
  const cnt={};log.forEach(e=>{const k=dayKey(e.t);cnt[k]=(cnt[k]||0)+1});
  let streak=0;const d=new Date();if(!cnt[dayKey(d.getTime())])d.setDate(d.getDate()-1);while(cnt[dayKey(d.getTime())]){streak++;d.setDate(d.getDate()-1)}
  const cells=[];for(let i=27;i>=0;i--){const t=new Date();t.setDate(t.getDate()-i);const n=cnt[dayKey(t.getTime())]||0;
    const col=n===0?"#1c120b":n===1?"#4f6b3a":n<4?"#769656":"#BACA44";
    cells.push('<div title="'+t.toDateString()+": "+n+' session'+(n===1?"":"s")+'" style="width:22px;height:22px;border-radius:4px;background:'+col+';border:1px solid #52361f"></div>')}
  const finds=log.filter(e=>e.k==="coord"&&e.mode==="find").slice(-20).map(e=>e.score);
  const names=log.filter(e=>e.k==="coord"&&e.mode==="name").slice(-20).map(e=>e.score);
  const checks=log.filter(e=>e.k==="check").slice(-15);
  const bres={win:0,loss:0,draw:0,resign:0};log.filter(e=>e.k==="blind").forEach(e=>bres[e.res]=(bres[e.res]||0)+1);
  const tile=(l,v)=>'<div class="panel" style="padding:12px 14px"><div class="muted small">'+l+'</div><div class="big" style="font-size:1.8rem">'+v+'</div></div>';
  const types=Object.entries(hist.types).sort((a,b)=>b[1]-a[1]),tmx=types.length?types[0][1]:1;
  el.innerHTML='<h2>Your stats</h2><div class="cards" style="margin-top:0;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">'+
   tile("Practice days",Object.keys(cnt).length)+tile("Current streak",streak+(streak===1?" day":" days"))+
   tile("Best: find square",co.bestFind||0)+tile("Best: name square",co.bestName||0)+
   tile("Blindfold record",(bl.w||0)+" W / "+Math.max(0,(bl.g||0)-(bl.w||0))+" other")+tile("Games checked",hist.games||0)+'</div>'+
  '<div class="panel" style="margin-top:14px"><h3>Last 28 days</h3><div style="display:flex;flex-wrap:wrap;gap:4px">'+cells.join("")+'</div><p class="muted small" style="margin:8px 0 0">Brighter squares mean more sessions that day.</p></div>'+
  '<div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">'+
   '<div class="panel"><h3>Coordinate drill: find the square</h3><div class="muted small">Score per 30-second round, latest 20</div>'+barChart(finds,"#769656")+'</div>'+
   '<div class="panel"><h3>Coordinate drill: name the square</h3><div class="muted small">Score per round, latest 20</div>'+barChart(names,"#BACA44")+'</div>'+
   '<div class="panel"><h3>Average loss per move</h3><div class="muted small">In pawns, per checked game (lower is better)</div>'+lineChart(checks.map(e=>e.avg/100),v=>v.toFixed(2),"#BACA44")+'</div>'+
   '<div class="panel"><h3>Blunders and mistakes per game</h3><div class="muted small">Latest 15 checked games</div>'+lineChart(checks.map(e=>e.b+e.m),v=>String(v),"#e08b5a")+'</div></div>'+
  '<div class="panel" style="margin-top:14px"><h3>Mistake types across all checked games</h3>'+(types.length?types.map(([t,n])=>'<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><b>'+t+'</b><span>'+n+'</span></div><div class="bar"><i style="width:'+(n/tmx*100)+'%"></i></div></div>').join(""):'<p class="muted small" style="margin:0">Check a game in the blunder checker to start this list.</p>')+'</div>'+
  '<div class="panel" style="margin-top:14px"><h3>Blindfold games</h3><p style="margin:0" class="small">Wins '+bres.win+' &middot; Losses '+bres.loss+' &middot; Draws '+bres.draw+' &middot; Resigned '+bres.resign+(bl.g?' &middot; Average peeks per game '+((bl.peeks||0)/bl.g).toFixed(1):"")+'</p></div>'+
  '<p style="margin-top:18px"><button class="btn alt" id="rst">Reset all stats</button></p>';
  let armed=null;const b=$("#rst");
  b.onclick=()=>{if(!armed){b.textContent="Click again to erase all stats";armed=setTimeout(()=>{armed=null;b.textContent="Reset all stats"},4000);return}
    clearTimeout(armed);["log","coords","blind","bhist"].forEach(k=>store.set(k,null));viewStats(el)};
  return()=>{if(armed)clearTimeout(armed)};
}

(function(){const c=$("#lbl");const on=store.get("labels",true);c.checked=on;document.body.classList.toggle("nolabels",!on);
  c.onchange=()=>{store.set("labels",c.checked);document.body.classList.toggle("nolabels",!c.checked)}})();
route();
Engine.init();
