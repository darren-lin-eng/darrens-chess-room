<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Darren's Chess Room</title>
<meta name="description" content="Chess practice for one player: coordinate drills, blindfold games against an engine, and a checker that sorts the blunders in your own games by cause.">

<meta property="og:title" content="Darren's Chess Room">
<meta property="og:description" content="Chess practice for one player: coordinate drills, blindfold games against an engine, and a checker that sorts the blunders in your own games by cause.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%23769656%27/%3E%3Crect x=%2716%27 y=%2716%27 width=%2716%27 height=%2716%27 fill=%27%23769656%27/%3E%3Crect x=%2716%27 width=%2716%27 height=%2716%27 fill=%27%23EEEED2%27/%3E%3Crect y=%2716%27 width=%2716%27 height=%2716%27 fill=%27%23EEEED2%27/%3E%3C/svg%3E">
<style>
@font-face{font-family:Lora;src:url("fonts/Lora-VF.woff2") format("woff2");font-weight:400 700;font-display:swap}
:root{color-scheme:dark;--bg:#1c120b;--bg-2:#2a1b11;--surface:#3b2717;--surface-2:#52361f;--rule:#6d4a2b;--wood:#8a6339;--tan:#d9bf93;--ink:#f4e8d4;--ink-muted:#cdb694;--accent:#BACA44;--accent-ink:#1c120b;--danger:#f0907a;--board-light:#EEEED2;--board-dark:#769656;--r:3px;--display:Lora,Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);line-height:1.55;min-height:100vh;background:repeating-linear-gradient(92deg,rgba(255,255,255,.016) 0 2px,transparent 2px 9px),repeating-linear-gradient(88deg,rgba(0,0,0,.12) 0 1px,transparent 1px 13px),var(--bg)}
::selection{background:var(--accent);color:var(--accent-ink)}
input,textarea{caret-color:var(--accent)}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0 0 .4em;color:var(--ink);text-wrap:balance}
h1{font-size:clamp(2rem,5vw,3rem);line-height:1.08;letter-spacing:-.015em}
h2{font-size:1.7rem;line-height:1.15;letter-spacing:-.01em}
h3{font-size:1.2rem;line-height:1.25}
p{text-wrap:pretty}
a{color:var(--ink);text-decoration-color:var(--accent);text-decoration-thickness:1px;text-underline-offset:.18em}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.skip{position:absolute;left:8px;top:-60px;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:var(--r);z-index:20;font-weight:600}
.skip:focus{top:8px}
header{background:var(--bg-2);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:5}
.hwrap{max-width:1040px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 24px}
.brand{font-family:var(--display);font-weight:700;font-size:1.2rem;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:10px;padding:6px 0}
.mk{width:22px;height:22px;flex:none;background:conic-gradient(var(--board-dark) 25%,var(--board-light) 0 50%,var(--board-dark) 0 75%,var(--board-light) 0);border-radius:2px}
nav{display:flex;flex-wrap:wrap;gap:2px 6px;flex:1}
nav a{color:var(--ink-muted);text-decoration:none;padding:10px 10px 8px;border-bottom:2px solid transparent;font-size:.95rem}
nav a:hover{color:var(--ink);border-bottom-color:var(--rule)}
nav a.on{color:var(--ink);border-bottom-color:var(--accent)}
#eng{font-size:.78rem;color:var(--ink-muted)}
main{max-width:1040px;margin:0 auto;padding:28px 16px 48px;outline:none}
footer{max-width:1040px;margin:0 auto;padding:18px 16px 36px;border-top:1px solid var(--rule);color:var(--ink-muted);font-size:.85rem}
.muted{color:var(--ink-muted)}.small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}
.block{border-top:1px solid var(--rule);padding:20px 0}
.hero{padding:12px 0 28px;max-width:46rem}
.hero h1{font-size:clamp(2.5rem,7vw,4.4rem);margin-bottom:.3em}
.lede{font-size:1.1rem;color:var(--ink-muted);margin:0;max-width:34rem}
.grid2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.row{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}.between{justify-content:space-between}
.index{list-style:none;margin:0;padding:0;border-bottom:1px solid var(--rule)}
.index a{display:grid;grid-template-columns:12rem minmax(0,1fr) auto;gap:6px 24px;align-items:baseline;padding:18px 4px;border-top:1px solid var(--rule);text-decoration:none}
.index .nm{font-family:var(--display);font-weight:700;font-size:1.45rem;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:.2em;text-decoration-thickness:2px}
.index .st{font-size:.88rem;color:var(--tan);text-align:right}
.btn{font:inherit;font-size:.95rem;font-weight:600;min-height:40px;border:1px solid var(--accent);border-radius:var(--r);padding:8px 16px;cursor:pointer;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center}
.btn:active{transform:translateY(1px)}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--wood)}
.btn:disabled{opacity:.5;cursor:default}
input[type=text],textarea,select{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--wood);border-radius:var(--r);padding:8px 10px;min-height:40px}
textarea{width:100%;min-height:150px;font-family:ui-monospace,Menlo,monospace;font-size:.82rem}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
label{font-size:.9rem}
.tgl{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--ink-muted);cursor:pointer;min-height:40px}
.tgl input{accent-color:var(--accent);width:18px;height:18px}
.board{--sq:min(calc((100vw - 52px)/8),60px);display:grid;grid-template-columns:repeat(8,var(--sq));padding:10px;border-radius:4px;width:max-content;max-width:100%;background:var(--wood);box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.board.mini{--sq:30px;padding:4px;border-radius:3px}
.board.mini .co{display:none}
.sq{width:var(--sq);height:var(--sq);position:relative;display:flex;align-items:center;justify-content:center;line-height:1;user-select:none}
.board.live .sq{cursor:pointer}
.sq.l{background:var(--board-light)}.sq.d{background:var(--board-dark)}
.sq>*{position:relative;z-index:2}
.sq::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none}
.sq.last::before{background:rgba(255,235,59,.42)}
.sq.sel::before{background:rgba(255,235,59,.7)}
.sq.good::before{background:rgba(60,190,70,.65)}
.sq.bad::before{background:rgba(220,60,50,.62)}
.sq.hint::before{background:rgba(70,160,255,.6)}
.sq.tgt::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(20,60,20,.38);z-index:3;pointer-events:none}
.sq.cap::after{content:"";position:absolute;inset:6%;border-radius:50%;border:4px solid rgba(20,60,20,.4);z-index:3;pointer-events:none}
.sq:focus{outline:none}
.sq:focus-visible{outline:3px solid #1c120b;outline-offset:-3px;box-shadow:inset 0 0 0 6px #fff;z-index:4}
.p{display:flex;width:100%;height:100%;align-items:center;justify-content:center}
.pc{width:90%;height:90%;display:block;background:center/contain no-repeat;filter:drop-shadow(0 1.5px 1px rgba(0,0,0,.3));pointer-events:none}
.co{position:absolute;font-size:10px;font-weight:700;z-index:2;pointer-events:none}
.co.f{right:3px;bottom:1px}.co.r{left:3px;top:1px}
.sq.l .co{color:#3d5a28}.sq.d .co{color:#10190a}
body.nolabels .co{display:none}
@media(hover:hover){.board.live .sq:hover{box-shadow:inset 0 0 0 3px rgba(0,0,0,.28)}.index a:hover{background:rgba(255,255,255,.045)}.index a:hover .nm{text-decoration-color:var(--accent)}.btn:hover{filter:brightness(1.1)}.btn.alt:hover{background:var(--surface);filter:none;border-color:var(--tan)}}
.big{font-family:var(--display);font-size:3.4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;min-height:1em}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 24px}
.fig{border-top:1px solid var(--rule);padding:12px 0 14px}
.fig .l{font-size:.82rem;color:var(--ink-muted)}
.fig .v{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1.15;font-variant-numeric:tabular-nums}
.fig .c{font-size:.82rem;color:var(--tan)}
.msg{padding:8px 12px;background:var(--bg);border-left:3px solid var(--wood);border-radius:0 var(--r) var(--r) 0;margin:12px 0}
.msg.err{border-left-color:var(--danger)}
.log{background:var(--bg);border-radius:var(--r);padding:8px 10px;height:130px;overflow:auto;font-size:.88rem;font-family:ui-monospace,Menlo,monospace}
.bar{height:8px;background:var(--bg);border-radius:1px;overflow:hidden}.bar i{display:block;height:100%;background:var(--tan)}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:var(--r);background:var(--surface-2);color:var(--ink)}
.tag.blunder{background:#8f2f2a;color:#fff}.tag.mistake{background:#7a4f0e;color:#fff}.tag.tp{background:var(--accent);color:var(--accent-ink)}
.issue{display:flex;gap:16px;align-items:flex-start;padding:16px 0;border-top:1px solid var(--rule)}
.xp p{margin:.4rem 0;font-size:.93rem;max-width:42rem}
.ax{stroke:var(--rule)}.ln{fill:none;stroke:var(--tan);stroke-width:2.5;stroke-linejoin:round}.dot{fill:var(--tan)}.dot.last,.bar-last{fill:var(--accent)}.bar-r{fill:var(--tan)}.tx{fill:var(--ink-muted);font-size:10px}
.heat{display:flex;flex-wrap:wrap;gap:4px;max-width:34rem}.heat i{width:22px;height:22px;border-radius:2px;background:var(--bg);border:1px solid var(--surface-2)}
.heat .h1{background:#5a3f27}.heat .h2{background:var(--wood)}.heat .h3{background:var(--tan)}
.band h3{margin-bottom:.2em}
.band ul{margin:.4rem 0 .8rem;padding-left:1.2rem}.band li{margin:3px 0}
@media(max-width:600px){
 header{position:static}
 nav{flex-wrap:nowrap;overflow-x:auto;flex-basis:100%;order:3}
 nav a{white-space:nowrap;padding:12px 10px 10px}
 .index a{grid-template-columns:1fr}.index .st{text-align:left}
 .big{font-size:2.6rem}
 main{padding-top:18px}
}
@media(prefers-reduced-motion:no-preference){a,.btn,nav a,.index a,.index .nm{transition:background-color .12s ease,color .12s ease,border-color .12s ease,text-decoration-color .12s ease}}
@media print{header,footer,.btn,.tgl,nav,textarea{display:none!important}body{background:#fff;color:#000}.muted,.fig .c,.fig .l{color:#333}h1,h2,h3{color:#000}.tx{fill:#333}.ln,.bar-r{stroke:#444;fill:#444}.ln{fill:none}}
</style>
</head>

const Engine={worker:null,mode:"builtin",queue:Promise.resolve(),p:null,cache:new Map(),
  init(){if(this.p)return this.p;
    this.p=new Promise(res=>{try{
      const w=new Worker("stockfish.js");let done=false;
      const fin=ok=>{if(done)return;done=true;if(ok){this.worker=w;this.mode="stockfish";w.postMessage("setoption name Hash value 16")}else{try{w.terminate()}catch(e){}}this.badge();res(ok)};
      w.onmessage=e=>{if(String(e.data).indexOf("uciok")>=0)fin(true)};w.onerror=()=>fin(false);

    }catch(e){this.badge();res(false)}});return this.p},
  badge(){const e=$("#eng");if(e)e.textContent=this.mode==="stockfish"?"Engine: Stockfish":"Engine: built-in (lighter)"},
  parse(u){if(!u||u==="(none)")return null;return{from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]}},
  newGame(){if(this.mode==="stockfish")this.worker.postMessage("ucinewgame");this.cache.clear()},
  analyze(fen,o){o=o||{};
    const key=this.mode+"|"+fen+"|"+(o.depth||0)+"|"+(o.movetime||0)+"|"+(o.exact?1:0);
    if(!o.noise&&this.cache.has(key))return Promise.resolve(this.cache.get(key));
    const job=()=>this.mode==="stockfish"?this.runSF(fen,o):Promise.resolve().then(()=>builtinSearch(fen,o.depth||2,o.noise||0,o.nodes,o.exact));
    const p=this.queue.then(job).then(r=>{if(!o.noise){if(this.cache.size>600)this.cache.delete(this.cache.keys().next().value);this.cache.set(key,r)}return r});
    this.queue=p.catch(()=>{});return p},
  runSF(fen,o){return new Promise(res=>{
    const w=this.worker;let score=0;const to=setTimeout(()=>w.postMessage("stop"),(o.movetime||600)+6000);
    w.onmessage=e=>{const l=String(e.data);
      if(l.indexOf("info")===0&&l.indexOf(" score ")>0&&l.indexOf("bound")<0){const m=l.match(/score (cp|mate) (-?\d+)/);
        if(m)score=m[1]==="cp"?+m[2]:(+m[2]>0?1:-1)*(30000-Math.abs(+m[2])*10)}
      else if(l.indexOf("bestmove")===0){clearTimeout(to);res({score,best:this.parse(l.split(" ")[1]),scores:null})}};
    w.postMessage("position fen "+fen);w.postMessage("go movetime "+(o.movetime||600))})},
  async weak(fen){
    const ch=new Chess(fen);const ms=ch.moves({verbose:true});if(!ms.length)return null;
    const elo=store.get("elo",800);if(Math.random()<levels(elo).rand){const m=ms[Math.floor(Math.random()*ms.length)];return{from:m.from,to:m.to,promotion:m.promotion}}
    await sleep(0);return builtinSearch(fen,2,60,40000).best}
};


const TYPE_TIPS={

  "Missed mate in one":"List every check you have before anything else.",
  "Hung a piece":"After choosing a move, ask whether anything can take the piece you just moved or uncovered.",
  "Ignored a threat":"Ask what their last move attacks before you continue your own plan.",
  "Missed free material":"Look for undefended enemy pieces first.",
  "Missed a tactic":"Check every capture and check for both sides, then choose.",

const SAMPLE="[Event \"Sample game\"]\n[White \"Sample_White\"]\n[Black \"Sample_Black\"]\n[Result \"1-0\"]\n\n1. e4 e5 2. Nf3 d6 3. Bc4 Bg4 4. Nc3 g6 5. Nxe5 Bxd1 6. Bxf7+ Ke7 7. Nd5# 1-0";
function flipTurn(fen){const p=fen.split(" ");p[1]=p[1]==="w"?"b":"w";p[3]="-";return p.join(" ")}
function freeCapture(fen){const ch=new Chess(fen);let best={gain:0,move:null};
  for(const m of ch.moves({verbose:true})){if(!m.captured)continue;ch.move(m);
    const mated=ch.in_checkmate();const rec=!mated&&ch.moves({verbose:true}).some(r=>r.to===m.to&&r.captured);ch.undo();
    const gain=mated?10000:PV[m.captured]-(rec?PV[m.piece]:0);if(gain>best.gain)best={gain,move:m,rec}}
  return best}
function mateInOne(fen){const ch=new Chess(fen);for(const m of ch.moves({verbose:true})){ch.move(m);const mt=ch.in_checkmate();ch.undo();if(mt)return m}return null}
const clampCp=c=>Math.max(-1000,Math.min(1000,c));

const NAME={p:"pawn",n:"knight",b:"bishop",r:"rook",q:"queen",k:"king"};
const PTS={p:1,n:3,b:3,r:5,q:9,k:0};
function matPts(fen,color){let s=0;for(const row of new Chess(fen).board())for(const p of row)if(p)s+=(p.color===color?1:-1)*PTS[p.type];return s}
function fmtEv(cp){return cp>=1000?"completely winning":cp<=-1000?"completely lost":(cp>0?"+":"")+(cp/100).toFixed(1)}
function describeMove(bm){if(!bm)return"";const bits=[];
  if(bm.flags.indexOf("k")>=0||bm.flags.indexOf("q")>=0)bits.push("castles");
  if(bm.captured)bits.push("takes a "+NAME[bm.captured]+" on "+bm.to);
  if(bm.promotion)bits.push("promotes a pawn");
  if(/[+#]/.test(bm.san))bits.push(bm.san.indexOf("#")>=0?"is checkmate":"gives check");
  if(!bits.length&&(bm.piece==="n"||bm.piece==="b")&&(bm.from[1]==="1"||bm.from[1]==="8"))bits.push("develops a "+NAME[bm.piece]);
  return bits.join(" and ")}
function explainMove(e,c){
  const m=c.m,pn=NAME[m.piece],sf=e.eng==="stockfish",who=sf?"Stockfish":"The 2-move search";
  const how=m.captured?"your "+pn+" took a "+NAME[m.captured]+" on "+m.to:"your "+pn+" moved from "+m.from+" to "+m.to;
  const what="You played <b>"+e.san+"</b> ("+how+"). "+who+" scores your position "+fmtEv(e.before)+" before the move and "+fmtEv(e.after)+" after it.";
  const twice=c.prev&&c.prev.piece===m.piece&&c.prev.to===m.from;
  let why="";
  switch(e.type){
    case"Missed mate in one":why="<b>"+c.myMate.san+"</b> was checkmate.";break;
    case"Allowed checkmate":why="After "+e.san+", <b>"+c.oppMate.san+"</b> is checkmate.";break;
    case"Hung a piece":{const t=c.fcPost.move;
      why="Their "+NAME[t.piece]+" on "+t.from+" can take your "+NAME[t.captured]+" on "+t.to+" (<b>"+t.san+"</b>). "+(c.fcPost.rec?"You can recapture, but you still lose material.":"You cannot recapture.")+(t.to===m.to?" That is the piece you just moved.":"");break}

async function analyzeGame(pgn,color,prog){

}

function viewCoords(el){
  const S=store.get("coords",{});let timer=null,running=false,t=30,score=0,miss=0,target="",mode=S.mode||"find",side=S.side||"white";
  const fg=(l,id,v)=>'<div><div class="small muted">'+l+'</div><div class="big num" style="font-size:1.9rem" id="'+id+'">'+v+'</div></div>';
  el.innerHTML='<h1>Coordinates</h1><div class="grid2"><div id="bw"></div><div>'+
  '<div class="row" style="margin-bottom:14px"><label>Mode <select id="mode"><option value="find">Find the square</option><option value="name">Name the square</option></select></label>'+
  '<label>Board <select id="side"><option value="white">White at bottom</option><option value="black">Black at bottom</option><option value="random">Random</option></select></label></div>'+
  '<div class="row between"><div class="big" id="tg" aria-live="polite">&nbsp;</div><div class="row" style="gap:22px">'+fg("Time","tm",30)+fg("Score","sc",0)+fg("Misses","ms",0)+'</div></div>'+
  '<div id="nameRow" class="row" style="margin-top:12px;display:none"><label for="ans">Square</label><input type="text" id="ans" maxlength="2" autocomplete="off" placeholder="e4" style="width:90px"></div>'+
  '<div class="msg" id="info" role="status">30 seconds. Each wrong click counts as a miss.</div>'+
  '<div class="row"><button class="btn" id="go">Start round</button></div>'+
  '<p class="muted small">Best: <span id="best" class="num"></span>. To hide the letters and numbers on the board, turn off Board coordinates in the header. Arrow keys and Enter work on the board.</p></div></div>';
  const b=new Board($("#bw"),{onSquare:click,label:"Coordinate board"});
  $("#mode").value=mode;$("#side").value=side;
  const rnd=()=>"abcdefgh"[Math.floor(Math.random()*8)]+(1+Math.floor(Math.random()*8));
  const bestTxt=()=>{const s=store.get("coords",{});$("#best").textContent="find "+(s.bestFind||0)+", name "+(s.bestName||0)};
  const draw=m=>b.render(null,{marks:m||{}});
  function next(){let n;do{n=rnd()}while(n===target);target=n;
    if(mode==="find"){$("#tg").textContent=target;draw()}else{$("#tg").textContent="?";draw({[target]:"hint"});$("#ans").value="";$("#ans").focus()}}
  function end(){running=false;clearInterval(timer);const s=store.get("coords",{});const key=mode==="find"?"bestFind":"bestName";let note="";logEvent({k:"coord",mode,score,miss});
    if(score>(s[key]||0)){s[key]=score;note=" New best."}store.set("coords",s);bestTxt();
    $("#info").textContent="Time. "+score+" correct, "+miss+" miss"+(miss===1?"":"es")+"."+note;$("#tg").innerHTML="&nbsp;";$("#go").textContent="Start another round";draw()}
  function start(){mode=$("#mode").value;side=$("#side").value;store.set("coords",Object.assign(store.get("coords",{}),{mode,side}));
    b.flip=side==="black"||(side==="random"&&Math.random()<.5);
    running=true;t=30;score=0;miss=0;target="";$("#sc").textContent=0;$("#ms").textContent=0;$("#tm").textContent=30;
    $("#nameRow").style.display=mode==="name"?"flex":"none";$("#info").textContent=mode==="find"?"Click the named square.":"Type the lit square's name, then press Enter.";
    next();clearInterval(timer);timer=setInterval(()=>{t--;$("#tm").textContent=t;if(t<=0)end()},1000)}
  function click(sq){if(!running||mode!=="find")return;
    if(sq===target){score++;$("#sc").textContent=score;draw({[sq]:"good"});next()}
    else{miss++;$("#ms").textContent=miss;draw({[sq]:"bad",[target]:"good"});setTimeout(()=>{if(running)draw()},350)}}
  $("#go").onclick=start;
  $("#ans").addEventListener("keydown",e=>{if(e.key!=="Enter"||!running||mode!=="name")return;
    const v=$("#ans").value.trim().toLowerCase();if(!v)return;
    if(v===target){score++;$("#sc").textContent=score;next()}else{miss++;$("#ms").textContent=miss;$("#info").textContent="That was "+target+".";next()}});
  draw();bestTxt();
  return()=>clearInterval(timer);
}

/* ---------- blindfold ---------- */
function viewBlind(el){
  let ch=new Chess(),me="w",over=true,busy=false,peeks=0,peek=false,last=null,alive=true;
  el.innerHTML='<h1>Blindfold</h1><div class="grid2"><div id="bw"></div><div>'+
  '<div class="row" style="margin-bottom:14px"><label>You play <select id="col"><option value="w">White</option><option value="b">Black</option></select></label><button class="btn alt" id="new">New game</button></div>'+
  '<div class="msg" id="info" role="status">No game yet. Press New game.</div>'+
  '<form id="f" class="row"><label for="mv">Your move</label><input type="text" id="mv" placeholder="e4, Nf3, O-O, e2e4" autocomplete="off" autocapitalize="off" style="flex:1;min-width:140px"><button class="btn" type="submit">Play</button></form>'+
  '<div class="row" style="margin:12px 0"><button class="btn alt" id="pk">Peek at board</button><button class="btn alt" id="pl">List my pieces</button><button class="btn alt" id="ml">Hide or show move list</button><button class="btn alt" id="rs">Resign</button></div>'+
  '<div class="log" id="log" tabindex="0" role="log" aria-label="Move list"></div><p class="muted small">Peeks this game: <b id="pc" class="num">0</b>. Opponent strength follows your rating on the home page.</p></div></div>';
  const b=new Board($("#bw"),{label:"Board with pieces hidden"});
  const draw=()=>b.render(ch,{hide:!peek,marks:last?{[last[0]]:"last",[last[1]]:"last"}:{}});
  const log=t=>{const l=$("#log");l.innerHTML+=t+"<br>";l.scrollTop=l.scrollHeight};
  function pieces(){const names={k:"King",q:"Queen",r:"Rook",b:"Bishop",n:"Knight",p:"Pawn"};const out={};
    "abcdefgh".split("").forEach(f=>{for(let r=1;r<=8;r++){const p=ch.get(f+r);if(p&&p.color===me){(out[p.type]=out[p.type]||[]).push(f+r)}}});
    return["k","q","r","b","n","p"].filter(t=>out[t]).map(t=>names[t]+": "+out[t].join(", ")).join("<br>")}
  function checkEnd(){if(!ch.game_over())return false;over=true;const bl=store.get("blind",{g:0,w:0,peeks:0});bl.g++;
    let t;if(ch.in_checkmate()){const winner=ch.turn()==="w"?"b":"w";t=winner===me?"Checkmate. You win.":"Checkmate. The engine wins.";if(winner===me)bl.w++}else t="Draw.";
    bl.peeks=(bl.peeks||0)+peeks;store.set("blind",bl);logEvent({k:"blind",res:ch.in_checkmate()?(ch.turn()===me?"loss":"win"):"draw",peeks,moves:Math.ceil(ch.history().length/2)});
    $("#info").textContent=t+" The board is shown.";peek=true;draw();return true}
  async function engineMove(){busy=true;$("#info").textContent="Engine is thinking…";const m=await Engine.weak(ch.fen());
    if(!alive)return;
    if(m){const r=ch.move(m);last=[r.from,r.to];log((Math.ceil(ch.history().length/2))+(r.color==="w"?". ":"... ")+"Engine: <b>"+r.san+"</b>")}
    busy=false;if(!checkEnd()){$("#info").textContent=ch.in_check()?"You are in check.":"Your move."}draw()}
  function newGame(){ch=new Chess();me=$("#col").value;over=false;peeks=0;peek=false;last=null;$("#pc").textContent=0;$("#log").innerHTML="";draw();
    $("#info").textContent=me==="w"?"Your move.":"Engine is thinking…";$("#mv").focus();if(me==="b")engineMove()}
  $("#new").onclick=newGame;
  $("#f").onsubmit=async e=>{e.preventDefault();if(over||busy||ch.turn()!==me){return}
    let txt=$("#mv").value.trim();if(!txt)return;txt=txt.replace(/0-0-0/g,"O-O-O").replace(/0-0/g,"O-O");
    let r=ch.move(txt,{sloppy:true});
    if(!r){const m=txt.toLowerCase().match(/^([a-h][1-8])[-\s]?([a-h][1-8])([qrbn])?$/);if(m)r=ch.move({from:m[1],to:m[2],promotion:m[3]||"q"})}
    if(!r){$("#info").innerHTML="That move isn't legal here. Try <b>Nf3</b> or <b>e2e4</b>.";$("#info").classList.add("err");return}
    $("#info").classList.remove("err");$("#mv").value="";peek=false;last=[r.from,r.to];log((Math.ceil(ch.history().length/2))+(r.color==="w"?". ":"... ")+"You: <b>"+r.san+"</b>");draw();
    if(!checkEnd())engineMove()};
  $("#pk").onclick=()=>{if(over)return;peeks++;$("#pc").textContent=peeks;peek=true;draw();setTimeout(()=>{if(!over){peek=false;draw()}},2500)};
  $("#pl").onclick=()=>{if(over&&ch.history().length===0)return;peeks++;$("#pc").textContent=peeks;$("#info").innerHTML="Your pieces:<br>"+pieces()};
  $("#ml").onclick=()=>{$("#log").style.display=$("#log").style.display==="none"?"block":"none"};
  $("#rs").onclick=()=>{if(over)return;over=true;peek=true;draw();$("#info").textContent="Resigned.";const bl=store.get("blind",{g:0,w:0});bl.g++;store.set("blind",bl);logEvent({k:"blind",res:"resign",peeks,moves:Math.ceil(ch.history().length/2)})};
  draw();
  return()=>{alive=false};
}


function viewBlunders(el){
  const U=store.get("user","");let alive=true;
  el.innerHTML='<h1>Blunder checker</h1><p class="muted" style="max-width:44rem;margin-top:0">On Chess.com, open a game, choose Share, then PGN, and copy it. On Lichess, use the PGN tab under the board. Paste it here.</p>'+
  '<label for="pgn" class="small muted">Game PGN</label><textarea id="pgn" spellcheck="false"></textarea>'+
  '<div class="row" style="margin-top:12px"><label>Your username <input type="text" id="user" value="'+String(U).replace(/[^\w.\-]/g,"")+'" style="width:160px"></label>'+
  '<label>I played <select id="col"><option value="auto">Match my username</option><option value="w">White</option><option value="b">Black</option></select></label>'+
  '<button class="btn" id="run">Check my game</button><button class="btn alt" id="smp">Load a sample</button></div>'+
  '<progress id="pb" max="100" value="0" hidden aria-label="Analysis progress" style="width:100%;margin-top:12px;accent-color:var(--accent)"></progress><div id="res" aria-live="polite"></div>';
  $("#smp").onclick=()=>{$("#pgn").value=SAMPLE;$("#col").value="b"};
  $("#run").onclick=async()=>{const pgn=$("#pgn").value.trim();const res=$("#res");
    if(!pgn){res.innerHTML='<div class="msg err">Paste a PGN first.</div>';return}
    const user=$("#user").value.trim();store.set("user",user);
    let col=$("#col").value;
    if(col==="auto"){const t=parsePgn(pgn);if(!t){res.innerHTML='<div class="msg err">That PGN could not be read. Copy the whole game, headers included.</div>';return}
      const h=t.header();if(user&&h.White&&h.White.toLowerCase()===user.toLowerCase())col="w";else if(user&&h.Black&&h.Black.toLowerCase()===user.toLowerCase())col="b";
      else{res.innerHTML='<div class="msg err">"'+(user||"(blank)").replace(/</g,"&lt;")+'" is not White ('+String(h.White||"unknown").replace(/</g,"&lt;")+') or Black ('+String(h.Black||"unknown").replace(/</g,"&lt;")+') in this game. Pick your color from the list.</div>';return}}
    $("#run").disabled=true;res.innerHTML="";const pb=$("#pb");pb.hidden=false;pb.value=0;
    await Engine.init();
    const data=await analyzeGame(pgn,col,p=>{pb.value=Math.round(p*100)});
    pb.hidden=true;$("#run").disabled=false;if(!alive)return;
    if(!data){res.innerHTML='<div class="msg err">That PGN could not be read. Copy the whole game, headers included.</div>';return}
    renderBlunders(res,data,col)};
  return()=>{alive=false};
}
function renderBlunders(el,d,col){
  const flagged=d.out.filter(e=>e.sev==="blunder"||e.sev==="mistake");
  const counts={blunder:0,mistake:0,inacc:0};d.out.forEach(e=>{if(e.sev)counts[e.sev]++});
  const types={};flagged.forEach(e=>{types[e.type]=(types[e.type]||0)+1});
  const hist=store.get("bhist",{games:0,types:{}});hist.games++;for(const k in types)hist.types[k]=(hist.types[k]||0)+types[k];store.set("bhist",hist);logEvent({k:"check",avg:d.avg,b:counts.blunder,m:counts.mistake,i:counts.inacc,types});
  const sf=Engine.mode==="stockfish";
  const fig=(l,v,c)=>'<div class="fig"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="c">'+c+'</div></div>';
  let h='<section class="block" style="margin-top:20px"><h2>Result</h2><div class="figs">'+fig("Blunders",counts.blunder,"moves that lost "+(levels(store.get("elo",800)).blunder/100).toFixed(1)+" pawns or more")+fig("Mistakes",counts.mistake,"smaller losses")+fig("Inaccuracies",counts.inacc,"not listed below")+fig("Average loss",(d.avg/100).toFixed(2),"pawns per move you played")+'</div>'+
   '<p class="muted small" style="margin:10px 0 0">'+(sf?"Analysis by Stockfish, about 0.35 seconds per position.":"Analysis by the built-in engine, which searches two moves deep. It misses longer tactics, so treat the verdicts as leads, not rulings.")+" Scores are from your side, in pawns.</p></section>";
  if(!flagged.length)h+='<div class="msg">No blunders or mistakes found by this engine.</div>';
  else{
    const entries=Object.entries(types).sort((a,b)=>b[1]-a[1]);const mx=entries[0][1];
    h+='<section class="block"><h2>Mistakes by type</h2>'+entries.map(([t,n])=>'<div style="margin:12px 0;max-width:40rem"><div class="row between"><b>'+t+'</b><span class="num">'+n+'</span></div><div class="bar"><i style="width:'+(n/mx*100)+'%"></i></div><div class="muted small" style="margin-top:2px">'+(TYPE_TIPS[t]||"")+'</div></div>').join("")+'</section>';
    if(d.tp)h+='<section class="block"><h2>Where the game turned</h2><p style="margin:0;max-width:42rem">On move '+d.tp.moveNo+' you played <b>'+d.tp.san+'</b> ('+d.tp.type.toLowerCase()+'). Your position went from '+fmtEv(d.tp.before)+' to '+fmtEv(d.tp.after)+'.'+(d.tp.bestSan?' The better move was <b>'+d.tp.bestSan+'</b>.':'')+'</p></section>';
    h+='<section class="block"><h2>Moves to review</h2><div id="iss"></div></section>'}
  el.innerHTML=h;
  const box=$("#iss",el);if(!box)return;
  flagged.forEach(e=>{const row=document.createElement("div");row.className="issue";const bw=document.createElement("div");
    row.appendChild(bw);const info=document.createElement("div");info.className="xp";const x=e.exp;
    info.innerHTML='<h3 style="margin-bottom:.3em">Move '+e.moveNo+': '+e.san+'</h3><div class="row" style="margin-bottom:6px"><span class="tag '+e.sev+'">'+(e.sev==="blunder"?"Blunder":"Mistake")+'</span>'+(d.tp===e?'<span class="tag tp">Turning point</span>':"")+'<span class="tag">'+e.type+'</span></div>'+
      '<p>'+x.what+'</p><p>'+x.why+'</p>'+(x.instead?'<p>'+x.instead+'</p>':"")+(x.avoid?'<p class="muted">'+x.avoid+'</p>':"");
    row.appendChild(info);box.appendChild(row);
    const marks={};marks[e.played.from]="bad";marks[e.played.to]="bad";if(e.best){marks[e.best.from]="good";marks[e.best.to]="good"}
    const bb=new Board(bw,{mini:true,flip:col==="b",label:"Position before move "+e.moveNo+". Red squares: "+e.played.from+" to "+e.played.to+(e.best?". Green squares: "+e.best.from+" to "+e.best.to:"")});bb.render(new Chess(e.pre),{marks,nocoords:true})});
}

/* ---------- stats ---------- */
function chartDates(n,ts){return n<2?"":'<text class="tx" x="28" y="108">'+fmtDate(ts[0])+'</text><text class="tx" x="352" y="108" text-anchor="end">'+fmtDate(ts[ts.length-1])+'</text>'}
function lineChart(pts,fmt,label){
  if(pts.length<2)return'<p class="muted small" style="margin:6px 0 0">Needs at least two entries.</p>';
  const vals=pts.map(p=>p.v),W=360,H=116,px=28,py=18,mx=Math.max(...vals,1e-9),mn=Math.min(...vals,0),rng=(mx-mn)||1;
  const X=i=>px+i*(W-px-8)/(vals.length-1),Y=v=>H-py-(v-mn)/rng*(H-2*py-4);
  const line=vals.map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ");
  return'<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" role="img" aria-label="'+label+'"><line class="ax" x1="'+px+'" y1="'+(H-py)+'" x2="'+(W-8)+'" y2="'+(H-py)+'"/>'+
   '<polyline class="ln" points="'+line+'"/>'+vals.map((v,i)=>'<circle class="dot'+(i===vals.length-1?" last":"")+'" cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="3.5"><title>'+fmtDate(pts[i].t)+": "+fmt(v)+'</title></circle>').join("")+
   '<text class="tx" x="2" y="'+(Y(mx)+4)+'">'+fmt(mx)+'</text><text class="tx" x="2" y="'+(H-py+4)+'">'+fmt(mn)+'</text>'+chartDates(2,pts.map(p=>p.t))+'</svg>'}
function barChart(pts,label){
  if(!pts.length)return'<p class="muted small" style="margin:6px 0 0">No rounds yet.</p>';
  const W=360,H=116,py=18,vals=pts.map(p=>p.v),mx=Math.max(...vals,1),bw=(W-12)/vals.length;
  return'<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" role="img" aria-label="'+label+'"><line class="ax" x1="4" y1="'+(H-py)+'" x2="'+(W-4)+'" y2="'+(H-py)+'"/>'+
   vals.map((v,i)=>{const h=v/mx*(H-2*py-4);return'<rect class="'+(v===mx?"bar-last":"bar-r")+'" x="'+(6+i*bw+1).toFixed(1)+'" y="'+(H-py-h).toFixed(1)+'" width="'+Math.max(2,bw-3).toFixed(1)+'" height="'+h.toFixed(1)+'"><title>'+fmtDate(pts[i].t)+": "+v+'</title></rect>'}).join("")+
   '<text class="tx" x="4" y="10">best '+mx+'</text>'+(pts.length>1?'<text class="tx" x="4" y="110">'+fmtDate(pts[0].t)+'</text><text class="tx" x="'+(W-4)+'" y="110" text-anchor="end">'+fmtDate(pts[pts.length-1].t)+'</text>':"")+'</svg>'}
function viewStats(el){
  const log=store.get("log",[]),co=store.get("coords",{}),bl=store.get("blind",{g:0,w:0,peeks:0}),hist=store.get("bhist",{games:0,types:{}});
  const cnt={};log.forEach(e=>{const k=dayNum(e.t);cnt[k]=(cnt[k]||0)+1});
  const days=Object.keys(cnt).map(Number).sort((a,b)=>a-b);
  let streak=0,longest=0,run=0;for(let i=0;i<days.length;i++){run=(i&&days[i]===days[i-1]+1)?run+1:1;if(run>longest)longest=run}
  const today=dayNum(Date.now());let dd=cnt[today]?today:today-1;while(cnt[dd]){streak++;dd--}
  const cells=[];let sessions28=0,active28=0;for(let i=27;i>=0;i--){const n=cnt[today-i]||0;sessions28+=n;if(n)active28++;
    const t=new Date();t.setDate(t.getDate()-i);cells.push('<i class="'+(n===0?"":n===1?"h1":n<4?"h2":"h3")+'" title="'+t.toDateString()+": "+n+" session"+(n===1?"":"s")+'"></i>')}
  const find=log.filter(e=>e.k==="coord"&&e.mode==="find").slice(-20).map(e=>({v:e.score,t:e.t}));
  const name=log.filter(e=>e.k==="coord"&&e.mode==="name").slice(-20).map(e=>({v:e.score,t:e.t}));
  const checks=log.filter(e=>e.k==="check").slice(-15);
  const bres={win:0,loss:0,draw:0,resign:0};log.filter(e=>e.k==="blind").forEach(e=>bres[e.res]=(bres[e.res]||0)+1);
  const fig=(l,v,c)=>'<div class="fig"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="c">'+c+'</div></div>';
  const lastCheck=checks[checks.length-1];
  const types=Object.entries(hist.types).sort((a,b)=>b[1]-a[1]),tmx=types.length?types[0][1]:1;
  const avgs=checks.map(e=>e.avg/100),bm=checks.map(e=>e.b+e.m);
  const tFind=find.length>1?"Find the square: "+find[find.length-1].v+" last round, "+Math.max(...find.map(p=>p.v))+" best":"Find the square";
  const tName=name.length>1?"Name the square: "+name[name.length-1].v+" last round, "+Math.max(...name.map(p=>p.v))+" best":"Name the square";
  const tAvg=checks.length>1?"Average loss: "+avgs[avgs.length-1].toFixed(2)+" pawns last game, "+(avgs[avgs.length-1]<avgs[0]?"down from ":avgs[avgs.length-1]>avgs[0]?"up from ":"same as ")+avgs[0].toFixed(2)+" in the first of these "+checks.length:"Average loss per move";
  const tBm=checks.length>1?"Blunders and mistakes: "+bm[bm.length-1]+" in the last game, "+(bm.reduce((a,b)=>a+b,0)/bm.length).toFixed(1)+" on average":"Blunders and mistakes per game";
  el.innerHTML='<h1>Stats</h1><div class="figs">'+
   fig("Practice days",days.length,days.length?"since "+fmtDate(days[0]*864e5+432e5):"nothing logged yet")+
   fig("Current streak",streak+(streak===1?" day":" days"),"longest "+longest)+
   fig("Best: find the square",co.bestFind||0,find.length?"last round "+find[find.length-1].v:"no rounds yet")+
   fig("Best: name the square",co.bestName||0,name.length?"last round "+name[name.length-1].v:"no rounds yet")+
   fig("Blindfold",bres.win+" W, "+bres.loss+" L, "+(bres.draw+bres.resign)+" other",bl.g?"average "+((bl.peeks||0)/bl.g).toFixed(1)+" peeks per game":"no games yet")+
   fig("Games checked",hist.games||0,lastCheck?"last: "+(lastCheck.avg/100).toFixed(2)+" pawns lost per move":"none yet")+'</div>'+
  '<section class="block"><h2>'+sessions28+' session'+(sessions28===1?"":"s")+' in the last 28 days</h2><div class="heat" role="img" aria-label="Activity over the last 28 days: '+active28+' days with sessions">'+cells.join("")+'</div><p class="muted small" style="margin:8px 0 0">Oldest day first, today last. Darker means fewer sessions: none, 1, 2 to 3, 4 or more.</p></section>'+
  '<section class="block"><div class="figs" style="gap:28px 32px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">'+
   '<div><h3>'+tFind+'</h3>'+barChart(find,tFind)+'</div><div><h3>'+tName+'</h3>'+barChart(name,tName)+'</div>'+
   '<div><h3>'+tAvg+'</h3>'+lineChart(checks.map(e=>({v:e.avg/100,t:e.t})),v=>v.toFixed(2),tAvg)+'</div><div><h3>'+tBm+'</h3>'+lineChart(checks.map(e=>({v:e.b+e.m,t:e.t})),v=>String(v),tBm)+'</div></div></section>'+
  '<section class="block"><h2>Mistake types, all checked games</h2>'+(types.length?types.map(([t,n])=>'<div style="margin:12px 0;max-width:40rem"><div class="row between"><b>'+t+'</b><span class="num">'+n+'</span></div><div class="bar"><i style="width:'+(n/tmx*100)+'%"></i></div></div>').join(""):'<p class="muted" style="margin:0">Check a game to start this list.</p>')+'</section>'+
  '<section class="block"><button class="btn alt" id="rst">Reset all stats</button></section>';
  let armed=null;const b=$("#rst");
  b.onclick=()=>{if(!armed){b.textContent="Press again to erase all stats";armed=setTimeout(()=>{armed=null;b.textContent="Reset all stats"},4000);return}
    clearTimeout(armed);["log","coords","blind","bhist"].forEach(k=>store.set(k,null));viewStats(el)};
  return()=>{if(armed)clearTimeout(armed)};
}

(function(){const c=$("#lbl");const on=store.get("labels",true);c.checked=on;document.body.classList.toggle("nolabels",!on);
  c.onchange=()=>{store.set("labels",c.checked);document.body.classList.toggle("nolabels",!c.checked)}})();
route();
Engine.init();
</script>
